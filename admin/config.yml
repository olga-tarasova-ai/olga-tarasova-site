                name: "lead"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }]
              - label: "Текст кнопки"
                name: "cta"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]

  - name: "legacy_cases"
    label: "Кейси портфоліо (наявні)"
    files:
      - file: "content/legacy-cases.json"
        label: "21 наявний кейс"
        name: "legacy_cases"
        fields:
          - label: "Кейси"
            name: "cases"
            widget: "list"
            summary: "{{fields.id}} — {{fields.title.ua}}"
            fields:
              - { label: "ID (не змінювати — використовується для посилань)", name: "id", widget: "string" }
              - label: "Напрямок"
                name: "category"
                widget: "select"
                options:
                  - { label: "Fashion & Lingerie", value: "fashion" }
                  - { label: "Beauty & Jewelry", value: "beauty" }
                  - { label: "Product & E-commerce", value: "product" }
                  - { label: "Food", value: "food" }
                  - { label: "Interior", value: "interior" }
                  - { label: "AI Content & Motion", value: "motion" }
              - { label: "Обкладинка (фото для картки в списку)", name: "cover", widget: "image" }
              - label: "Назва кейсу"
                name: "title"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Завдання (що просив бренд)"
                name: "task"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }]
              - label: "Концепція (яку візуальну ідею запропонували)"
                name: "concept"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }]
              - label: "Результат (напр. \"5 зображень страв · меню ресторану\")"
                name: "deliverables"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Блоки контенту кейсу (порядок можна змінювати перетягуванням, можна додавати/видаляти)"
                name: "blocks"
                widget: "list"
                summary: "{{fields.type}}"
                types:
                  - label: "Галерея зображень/відео (сітка)"
                    name: "menu"
                    widget: "object"
                    fields:
                      - { label: "4 колонки замість звичайної сітки", name: "grid4", widget: "boolean", default: false, required: false }
                      - label: "Кадри (можна додавати, видаляти, міняти місцями)"
                        name: "items"
                        widget: "list"
                        summary: "{{fields.name.ua}}"
                        fields:
                          - label: "Тип кадру"
                            name: "media"
                            widget: "select"
                            options:
                              - { label: "Фото", value: "image" }
                              - { label: "Відео", value: "video" }
                            default: "image"
                          - { label: "Квадратна картка (для сіток на кшталт Amazon-лістингу)", name: "square", widget: "boolean", default: false, required: false }
                          - { label: "Фото", name: "image", widget: "image", required: false, hint: "Заповнюйте, якщо тип кадру — Фото" }
                          - { label: "Відео-файл (mp4)", name: "video", widget: "file", required: false, hint: "Заповнюйте, якщо тип кадру — Відео" }
                          - { label: "Постер для відео (кадр-заглушка)", name: "poster", widget: "image", required: false, hint: "Заповнюйте, якщо тип кадру — Відео" }
                          - { label: "Alt-текст фото (для пошукових систем)", name: "alt", widget: "string", required: false }
                          - label: "Категорія підпису (напр. Закуска, Beauty, Ракурси)"
                            name: "course"
                            widget: "object"
                            required: false
                            fields: [{ label: "UA", name: "ua", widget: "string", required: false }, { label: "EN", name: "en", widget: "string", required: false }]
                          - label: "Назва кадру"
                            name: "name"
                            widget: "object"
                            required: false
                            fields: [{ label: "UA", name: "ua", widget: "string", required: false }, { label: "EN", name: "en", widget: "string", required: false }]
                  - label: "До / Після (слайдер з двома фото)"
                    name: "ba"
                    widget: "object"
                    fields:
                      - { label: "Вертикальний формат (портрет)", name: "portrait", widget: "boolean", default: false, required: false }
                      - label: "Фото «До»"
                        name: "before"
                        widget: "object"
                        fields:
                          - { label: "Фото", name: "image", widget: "image" }
                          - { label: "Alt-текст", name: "alt", widget: "string", required: false }
                      - label: "Фото «Після»"
                        name: "after"
                        widget: "object"
                        fields:
                          - { label: "Фото", name: "image", widget: "image" }
                          - { label: "Alt-текст", name: "alt", widget: "string", required: false }

  - name: "cases"
    label: "Кейси портфоліо (нові)"
    files:
      - file: "content/cases.json"
        label: "Нові кейси (додаються поверх існуючих)"
        name: "cases"
        fields:
          - label: "Кейси"
            name: "cases"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Унікальний ID (латиницею, без пробілів, напр. case-10)", name: "id", widget: "string" }
              - label: "Напрямок"
                name: "category"
                widget: "select"
                options:
                  - { label: "Fashion & Lingerie", value: "fashion" }
                  - { label: "Beauty & Jewelry", value: "beauty" }
                  - { label: "Product & E-commerce", value: "product" }
                  - { label: "Food", value: "food" }
                  - { label: "Interior", value: "interior" }
                  - { label: "AI Content & Motion", value: "motion" }
              - label: "Назва кейсу (формат: Бренд/Товар — Тип кампанії, напр. \"Lip Gloss — Beauty Campaign\")"
                name: "title"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Завдання (що просив бренд)"
                name: "task"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Концепція (яку візуальну ідею запропонували)"
                name: "concept"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Результат (напр. \"5 зображень · beauty-кампанія\")"
                name: "deliverables"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - { label: "Обкладинка (фото для картки)", name: "cover", widget: "image" }
              - label: "Галерея"
                name: "gallery"
                widget: "list"
                fields:
                  - { label: "Фото", name: "image", widget: "image" }
                  - { label: "Підпис — укр", name: "caption_ua", widget: "string", required: false }
                  - { label: "Підпис — англ", name: "caption_en", widget: "string", required: false }
