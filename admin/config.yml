backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main

# Preview links point back at the live site
site_url: https://YOUR_SITE_NAME.netlify.app
display_url: https://YOUR_SITE_NAME.netlify.app

media_folder: "images/uploads"
public_folder: "images/uploads"

locale: "uk"

collections:
  - name: "site"
    label: "Тексти сайту"
    files:
      - file: "content/site.json"
        label: "Загальний контент"
        name: "site"
        fields:
          - label: "Головний екран (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Підпис під логотипом — укр", name: "tag_ua_placeholder", widget: "hidden", required: false }
              - label: "Тег під логотипом"
                name: "tag"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Заголовок — рядок 1"
                name: "title_l1"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Заголовок — рядок 2 (залиште порожнім, якщо заголовок з 2 рядків)"
                name: "title_l2"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string", required: false }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Заголовок — останній рядок (виділений)"
                name: "title_l3"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Текст під заголовком"
                name: "lead"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "text" }
                  - { label: "EN", name: "en", widget: "text" }
              - label: "Кнопка 1 (основна — веде на портфоліо)"
                name: "cta"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Кнопка 2 (додаткова — веде на контакти)"
                name: "cta2"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }

          - label: "Про мене"
            name: "about"
            widget: "object"
            fields:
              - label: "Надпис (капс)"
                name: "cap"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Заголовок"
                name: "heading"
                widget: "object"
                fields:
                  - label: "Рядок 1"
                    name: "line1"
                    widget: "object"
                    fields:
                      - { label: "UA", name: "ua", widget: "string" }
                      - { label: "EN", name: "en", widget: "string" }
                  - label: "Рядок 2 (звичайний)"
                    name: "line2"
                    widget: "object"
                    fields:
                      - { label: "UA", name: "ua", widget: "string" }
                      - { label: "EN", name: "en", widget: "string" }
                  - label: "Рядок 2 (виділене слово)"
                    name: "accent"
                    widget: "object"
                    fields:
                      - { label: "UA", name: "ua", widget: "string" }
                      - { label: "EN", name: "en", widget: "string" }
              - label: "Абзац 1"
                name: "p1"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "text" }
                  - { label: "EN", name: "en", widget: "text" }
              - label: "Абзац 2"
                name: "p2"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "text" }
                  - { label: "EN", name: "en", widget: "text" }
              - label: "Base — підпис"
                name: "base_label"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Base — значення"
                name: "base_value"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Working — підпис"
                name: "working_label"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Working — значення"
                name: "working_value"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Focus — підпис"
                name: "focus_label"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Focus — значення"
                name: "focus_value"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }

          - label: "Портфоліо — заголовок секції"
            name: "portfolio"
            widget: "object"
            fields:
              - label: "Заголовок"
                name: "heading"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Підзаголовок"
                name: "sub"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Вступний текст"
                name: "intro"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "text" }
                  - { label: "EN", name: "en", widget: "text" }
              - label: "Напрямки"
                name: "categories"
                widget: "object"
                fields:
                  - label: "01 · Fashion & Lingerie"
                    name: "fashion"
                    widget: "object"
                    fields:
                      - label: "Назва"
                        name: "title"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - label: "Підпис"
                        name: "sub"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - { label: "Фонове зображення картки (розмір, кадрування й затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "02 · Beauty & Jewelry"
                    name: "beauty"
                    widget: "object"
                    fields:
                      - label: "Назва"
                        name: "title"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - label: "Підпис"
                        name: "sub"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - { label: "Фонове зображення картки (розмір, кадрування й затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "03 · Product & E-commerce"
                    name: "product"
                    widget: "object"
                    fields:
                      - label: "Назва"
                        name: "title"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - label: "Підпис"
                        name: "sub"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - { label: "Фонове зображення картки (розмір, кадрування й затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "04 · Food"
                    name: "food"
                    widget: "object"
                    fields:
                      - label: "Назва"
                        name: "title"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - label: "Підпис"
                        name: "sub"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - { label: "Фонове зображення картки (розмір, кадрування й затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "05 · Interior"
                    name: "interior"
                    widget: "object"
                    fields:
                      - label: "Назва"
                        name: "title"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - label: "Підпис"
                        name: "sub"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - { label: "Фонове зображення картки (розмір, кадрування й затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "06 · AI Content & Motion"
                    name: "motion"
                    widget: "object"
                    fields:
                      - label: "Назва"
                        name: "title"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - label: "Підпис"
                        name: "sub"
                        widget: "object"
                        fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
                      - { label: "Фонове зображення картки (розмір, кадрування й затемнення на сайті не змінюються)", name: "image", widget: "image" }
              - label: "«За межами каталогу» — текст"
                name: "beyond_label"
                widget: "object"
                fields:
                  - { label: "UA", name: "ua", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }

          - label: "Послуги"
            name: "services"
            widget: "object"
            fields:
              - label: "Заголовок"
                name: "heading"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Підзаголовок"
                name: "sub"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Вступний текст"
                name: "intro"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }]
              - label: "Дрібний підпис під вступним текстом (напр. про generative AI)"
                name: "note"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Картки послуг"
                name: "cards"
                widget: "object"
                fields:
                  - label: "01 · Fashion & Lingerie"
                    name: "c1"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                      - { label: "Зображення картки (розмір і затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "02 · Beauty"
                    name: "c2"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                      - { label: "Зображення картки (розмір і затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "03 · Product & E-commerce"
                    name: "c3"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                      - { label: "Зображення картки (розмір і затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "04 · Jewelry & Accessories"
                    name: "c4"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                      - { label: "Зображення картки (розмір і затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "05 · Food"
                    name: "c5"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                      - { label: "Зображення картки (розмір і затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "06 · Interior"
                    name: "c6"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                      - { label: "Зображення картки (розмір і затемнення на сайті не змінюються)", name: "image", widget: "image" }
                  - label: "07 · AI Content & Motion"
                    name: "c7"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                      - { label: "Зображення картки (розмір і затемнення на сайті не змінюються)", name: "image", widget: "image" }

          - label: "Процес"
            name: "process"
            widget: "object"
            fields:
              - label: "Заголовок"
                name: "heading"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Підзаголовок"
                name: "sub"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Кроки"
                name: "steps"
                widget: "object"
                fields:
                  - label: "Крок 1"
                    name: "s1"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                  - label: "Крок 2"
                    name: "s2"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                  - label: "Крок 3"
                    name: "s3"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }
                  - label: "Крок 4"
                    name: "s4"
                    widget: "object"
                    fields:
                      - { label: "Назва", name: "title", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                      - { label: "Опис", name: "desc", widget: "object", fields: [{ label: "UA", name: "ua", widget: "text" }, { label: "EN", name: "en", widget: "text" }] }

          - label: "Контакти"
            name: "contact"
            widget: "object"
            fields:
              - label: "Надпис (капс)"
                name: "cap"
                widget: "object"
                fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }]
              - label: "Заголовок"
                name: "heading"
                widget: "object"
                fields:
                  - { label: "Рядок 1", name: "line1", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                  - { label: "Рядок 2 (звичайний)", name: "line2", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
                  - { label: "Рядок 2 (виділене слово)", name: "accent", widget: "object", fields: [{ label: "UA", name: "ua", widget: "string" }, { label: "EN", name: "en", widget: "string" }] }
